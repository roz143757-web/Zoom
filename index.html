<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoom Workplace</title>

<meta name="description" content="Download Zoom Workplace APK directly with a simple premium download page.">
<meta name="keywords" content="Zoom Workplace, Zoom APK, Download Zoom, Zoom App">
<meta name="theme-color" content="#2563eb">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f172a,#1e3a8a,#020617);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  padding:20px;
}

.card{
  width:100%;
  max-width:390px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:26px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.35);
  animation:cardIn .8s ease;
}

@keyframes cardIn{
  from{opacity:0; transform:translateY(35px) scale(.96);}
  to{opacity:1; transform:translateY(0) scale(1);}
}

.logoBox{
  width:96px;
  height:96px;
  border-radius:28px;
  margin:0 auto 18px;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 15px 35px rgba(37,99,235,.45);
  overflow:hidden;
}

.logoBox img{
  width:70px;
  height:70px;
  object-fit:contain;
}

.fallbackLogo{
  font-size:54px;
  font-weight:900;
  display:none;
}

h1{
  font-size:28px;
  margin-bottom:8px;
}

p{
  font-size:15px;
  line-height:1.6;
  color:#dbeafe;
  margin-bottom:22px;
}

.downloadBtn{
  width:100%;
  border:none;
  border-radius:18px;
  padding:16px;
  font-size:17px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  box-shadow:0 14px 30px rgba(37,99,235,.45);
  cursor:pointer;
  transition:.25s;
}

.downloadBtn:active{
  transform:scale(.97);
}

.downloadBtn:disabled{
  opacity:.75;
  cursor:not-allowed;
}

.loader{
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,.4);
  border-top-color:white;
  border-radius:50%;
  display:inline-block;
  vertical-align:middle;
  margin-right:8px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

.note{
  margin-top:18px;
  font-size:13px;
  color:#bfdbfe;
}
</style>
</head>

<body>

<div class="card">
  <div class="logoBox">
    <img id="zoomLogo" src="https://st1.zoom.us/zoom.ico" alt="Zoom Logo">
    <div id="fallbackLogo" class="fallbackLogo">Z</div>
  </div>

  <h1>Zoom Workplace</h1>

  <p>
    Download the Zoom Workplace app directly on your Android phone.
    Tap the button below to start downloading.
  </p>

  <button class="downloadBtn" id="downloadBtn">
    Download Zoom App
  </button>

  <div class="note">
    After clicking download, check your notification bar for download status.
  </div>
</div>

<script>
const downloadBtn = document.getElementById("downloadBtn");
const zoomLogo = document.getElementById("zoomLogo");
const fallbackLogo = document.getElementById("fallbackLogo");

const zoomApkLink = "https://zoom.us/client/latest/zoom.apk";

zoomLogo.onerror = function(){
  zoomLogo.style.display = "none";
  fallbackLogo.style.display = "block";
};

function speak(text){
  try{
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "hi-IN";
    msg.rate = 0.95;
    msg.pitch = 1;
    window.speechSynthesis.speak(msg);
  }catch(e){}
}

window.addEventListener("load", function(){
  setTimeout(function(){
    speak("Zoom Workplace app ko download karne ke liye download button par click karein");
  }, 700);
});

downloadBtn.addEventListener("click", function(){
  speak("Downloading start ho gaya. Upar se notification bar ko scroll down karke status dekhein");

  downloadBtn.disabled = true;
  downloadBtn.innerHTML = '<span class="loader"></span>Downloading...';

  const a = document.createElement("a");
  a.href = zoomApkLink;
  a.download = "Zoom_Workplace.apk";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(function(){
    downloadBtn.disabled = false;
    downloadBtn.innerHTML = "Download Zoom App";
  }, 20000);
});
</script>

</body>
</html>
